version: "2"
sql:
  - schema: "sql/schema"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        overrides:
          - db_type: uuid
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - column: "messages.metadata"
            go_type:
              import: "github.com/szidorpatrik/rift-chat/backend/rift-chat-api/internal/models"
              package: "models"
              type: "MessageMetadata"
          - column: "users.password_hash"
            go_struct_tag: 'json:"-"'
