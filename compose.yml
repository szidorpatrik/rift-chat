services:
  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/docker
    # Comment out 'ports' in production for better security
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/18/docker
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riftchat_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - BACKEND_HTTP_PORT=${BACKEND_HTTP_PORT}
      - BACKEND_QUIC_PORT=${BACKEND_QUIC_PORT}
      - BACKEND_PLATFORM=${BACKEND_PLATFORM}
      - BACKEND_LISTEN_ADDR=${BACKEND_LISTEN_ADDR}
      - BACKEND_JWT_SECRET=${BACKEND_JWT_SECRET}
      - BACKEND_DATABASE_URL=${BACKEND_DATABASE_URL}
      - BACKEND_VALKEY_HOST=${BACKEND_VALKEY_HOST}
      - BACKEND_VALKEY_PORT=${BACKEND_VALKEY_PORT}
      - BACKEND_CERT_NAME=${BACKEND_CERT_NAME}
      - BACKEND_KEY_NAME=${BACKEND_KEY_NAME}
    ports:
    #  - "${BACKEND_HTTP_PORT}:${BACKEND_HTTP_PORT}"
      - "${BACKEND_QUIC_PORT}:${BACKEND_QUIC_PORT}/udp"
    volumes:
      - ./backend/certs:/root/certs:ro
    depends_on:
      db:
        condition: service_healthy
        required: true
        restart: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider
            http://127.0.0.1:${BACKEND_HTTP_PORT}/healthz || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - riftchat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT}
    #ports:
    #  - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - riftchat_network

  caddy:
    image: caddy:alpine
    container_name: ${CADDY_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - './caddy/Caddyfile:/etc/caddy/Caddyfile'
      - './backend/certs:/etc/caddy/certs:ro'
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - riftchat_network

  valkey:
    image: valkey/valkey:latest
    container_name: ${VALKEY_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${BACKEND_VALKEY_PORT}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riftchat_network

volumes:
  caddy_data:
  caddy_config:
  valkey_data:

networks:
  riftchat_network:
    driver: bridge
