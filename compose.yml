services:
  db:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./postgres:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - riftchat_network

  valkey:
    image: valkey/valkey:alpine
    container_name: ${VALKEY_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT}:${VALKEY_PORT}"
    volumes:
      - valkeydata:/data
    networks:
      - riftchat_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - HTTP_PORT=${BACKEND_HTTP_PORT}
      - QUIC_PORT=${BACKEND_QUIC_PORT}
      - PLATFORM=${BACKEND_PLATFORM}
      - LISTEN_ADDR=${BACKEND_LISTEN_ADDR}
      - JWT_SECRET=${BACKEND_JWT_SECRET}
      - VALKEY_URL=${BACKEND_VALKEY_URL}
      - DB_URL=${BACKEND_DATABASE_URL}
    ports:
      - "${BACKEND_HTTP_PORT}:${BACKEND_HTTP_PORT}"
      - "${BACKEND_QUIC_PORT}:${BACKEND_QUIC_PORT}/udp"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${BACKEND_HTTP_PORT}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - riftchat_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - VITE_FRONTEND_PORT=${VITE_FRONTEND_PORT}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WEBTRANSPORT_URL=${VITE_WEBTRANSPORT_URL}
    ports:
      - "${VITE_FRONTEND_PORT}:${VITE_FRONTEND_PORT}"
    depends_on:
      - backend
    networks:
      - riftchat_network

volumes:
  valkeydata:

networks:
  riftchat_network:
    driver: bridge
